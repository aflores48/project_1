<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Trirong">
  <title>Google Maps API</title>
  <style>
    #map {
      height: 100%;
      width: 100%;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap&libraries=places" async defer></script>
</head>
<body id="main">
  <nav id="main-nav">
  <ul>
    <li><a href="index.html" >Resume</a></li>
    <li><a href="gearlist.html" >Gear List</a></li>
    <li><a href="tour_guide.html" >Yellowstone Sights</a></li>
    <li><a href="googlemaps.html" >Map</a></li>
  </ul>
  </nav>
  <div id="map"></div>
  <input id="pac-input" class="controls" type="text" placeholder="Search Box" style="width: 300px; padding: 5px; position: absolute; top: 10px; left: 50%; margin-left: -150px;">
  <script>
    let map;
    let marker;
    function initMap() {
      const center = { lat: -34.397, lng: 150.644 };
      map = new google.maps.Map(document.getElementById('map'), {
        center: center,
        zoom: 8, 
        styles: [ 
          {
            "elementType": "geometry",
            "stylers": [
              {
                "color": "#212121"
              }
            ]
          },
          {
            "elementType": "labels.icon",
            "stylers": [
              {
                "visibility": "off"
              }
            ]
          },
          {
            "elementType": "labels.text.fill",
            "stylers": [
              {
                "color": "#757575"
              }
            ]
          },
          {
            "elementType": "labels.text.stroke",
            "stylers": [
              {
                "color": "#212121"
              }
            ]
          }
        ]
      });
      marker = new google.maps.Marker({
        position: center,
        map: map,
        title: "Hello World!"
      });
      const infoWindow = new google.maps.InfoWindow({
        content: "<h3>Welcome to the Map</h3><p>This is a custom marker.</p>"
      });

      marker.addListener("click", () => {
        infoWindow.open(map, marker);
      });
      const input = document.getElementById("pac-input");
      const searchBox = new google.maps.places.SearchBox(input);
      map.controls[google.maps.ControlPosition.TOP_CENTER].push(input);
      map.addListener("bounds_changed", () => {
        searchBox.setBounds(map.getBounds());
      });
      searchBox.addListener("places_changed", () => {
        const places = searchBox.getPlaces();

        if (places.length == 0) {
          return;
        }
        marker.setMap(null);
        const bounds = new google.maps.LatLngBounds();

        places.forEach((place) => {
          if (!place.geometry) {
            return;
          }
          marker = new google.maps.Marker({
            map: map,
            title: place.name,
            position: place.geometry.location,
          });
          bounds.extend(place.geometry.location);
        });
        map.fitBounds(bounds);
      });
    }
  </script>
</body>
</html>
